<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="100%" height="100%">
  <defs>
    <!-- Import beautiful font -->
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&amp;family=Space+Grotesk:wght@500;700&amp;display=swap');
      
      .title {
        font-family: 'Space Grotesk', sans-serif;
        font-weight: 700;
        font-size: 54px;
        fill: url(#title-grad);
        letter-spacing: 2px;
        filter: drop-shadow(0px 10px 20px rgba(139, 92, 246, 0.4));
        animation: float 4s ease-in-out infinite alternate;
      }
      
      .subtitle {
        font-family: 'Outfit', sans-serif;
        font-weight: 500;
        font-size: 20px;
        fill: #A78BFA;
        letter-spacing: 4px;
        text-transform: uppercase;
        animation: pulse 3s ease-in-out infinite alternate;
      }

      .logo-text {
        font-family: 'Space Grotesk', sans-serif;
        font-weight: 700;
        font-size: 42px;
        fill: #FFFFFF;
      }
      
      /* Smooth floating animations */
      @keyframes float {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-10px); }
      }
      
      @keyframes pulse {
        0% { opacity: 0.8; filter: drop-shadow(0 0 2px rgba(167, 139, 250, 0.2)); }
        100% { opacity: 1; filter: drop-shadow(0 0 15px rgba(167, 139, 250, 0.8)); }
      }

      @keyframes rotate {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }

      .grid-lines {
        stroke: rgba(139, 92, 246, 0.08);
        stroke-width: 1;
      }

      .network-node {
        animation: float 6s ease-in-out infinite alternate;
      }

      .orbiting-circle {
        transform-origin: 150px 160px;
        animation: rotate 20s linear infinite;
      }
    </style>

    <!-- Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090514" />
      <stop offset="50%" stop-color="#0F0C20" />
      <stop offset="100%" stop-color="#040209" />
    </linearGradient>

    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="50%" stop-color="#EC4899" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>

    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0.1" />
    </linearGradient>

    <linearGradient id="logo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EC4899" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="100%" height="100%" rx="16" fill="url(#bg-grad)" />
  <rect width="100%" height="100%" rx="16" fill="none" stroke="rgba(139, 92, 246, 0.2)" stroke-width="1.5" />

  <!-- Animated Tech Grid Background -->
  <g class="grid-lines">
    <!-- Horizontal lines -->
    <line x1="0" y1="40" x2="900" y2="40" />
    <line x1="0" y1="80" x2="900" y2="80" />
    <line x1="0" y1="120" x2="900" y2="120" />
    <line x1="0" y1="160" x2="900" y2="160" />
    <line x1="0" y1="200" x2="900" y2="200" />
    <line x1="0" y1="240" x2="900" y2="240" />
    <line x1="0" y1="280" x2="900" y2="280" />
    <!-- Vertical lines -->
    <line x1="100" y1="0" x2="100" y2="320" />
    <line x1="200" y1="0" x2="200" y2="320" />
    <line x1="300" y1="0" x2="300" y2="320" />
    <line x1="400" y1="0" x2="400" y2="320" />
    <line x1="500" y1="0" x2="500" y2="320" />
    <line x1="600" y1="0" x2="600" y2="320" />
    <line x1="700" y1="0" x2="700" y2="320" />
    <line x1="800" y1="0" x2="800" y2="320" />
  </g>

  <!-- Premium Decorative Mesh/Light Glows -->
  <circle cx="150" cy="160" r="130" fill="url(#accent-grad)" filter="blur(40px)" opacity="0.4" />
  <circle cx="750" cy="160" r="120" fill="url(#accent-grad)" filter="blur(50px)" opacity="0.3" />

  <!-- Animated Tech Graphic (Left Side) -->
  <g class="network-node">
    <!-- Connection lines -->
    <line x1="150" y1="160" x2="90" y2="100" stroke="#8B5CF6" stroke-width="1.5" opacity="0.6" />
    <line x1="150" y1="160" x2="210" y2="100" stroke="#8B5CF6" stroke-width="1.5" opacity="0.6" />
    <line x1="150" y1="160" x2="90" y2="220" stroke="#EC4899" stroke-width="1.5" opacity="0.6" />
    <line x1="150" y1="160" x2="210" y2="220" stroke="#EC4899" stroke-width="1.5" opacity="0.6" />
    
    <!-- Outer Orbiting ring -->
    <circle cx="150" cy="160" r="75" fill="none" stroke="#06B6D4" stroke-width="1" stroke-dasharray="6,6" opacity="0.5" class="orbiting-circle" />

    <!-- Center Tech Shield / Hexagon -->
    <polygon points="150,120 185,140 185,180 150,200 115,180 115,140" fill="url(#logo-grad)" filter="drop-shadow(0 4px 10px rgba(139, 92, 246, 0.4))" />
    <polygon points="150,128 178,145 178,175 150,192 122,175 122,145" fill="#090514" />
    <text x="150" y="173" text-anchor="middle" class="logo-text" fill="#FFFFFF">T</text>
    
    <!-- Peripheral Nodes -->
    <circle cx="90" cy="100" r="6" fill="#8B5CF6" filter="url(#glow)" />
    <circle cx="210" cy="100" r="6" fill="#38BDF8" filter="url(#glow)" />
    <circle cx="90" cy="220" r="6" fill="#EC4899" filter="url(#glow)" />
    <circle cx="210" cy="220" r="6" fill="#F59E0B" filter="url(#glow)" />
  </g>

  <!-- Typography (Center-Right Side) -->
  <g transform="translate(320, 0)">
    <!-- Main Title -->
    <text x="0" y="125" class="title">Tushar Kosish</text>
    
    <!-- Subtitle -->
    <text x="0" y="170" class="subtitle">Web Developer • AI Automation</text>

    <!-- Decorative divider line -->
    <line x1="0" y1="195" x2="480" y2="195" stroke="rgba(139, 92, 246, 0.3)" stroke-width="2" stroke-dasharray="5 5" />

    <!-- Dynamic tags or features -->
    <g transform="translate(0, 235)">
      <!-- Tag 1 -->
      <rect x="0" y="0" width="130" height="30" rx="15" fill="rgba(139, 92, 246, 0.15)" stroke="rgba(139, 92, 246, 0.4)" stroke-width="1" />
      <circle cx="15" cy="15" r="4" fill="#8B5CF6" />
      <text x="30" y="20" font-family="'Space Grotesk', sans-serif" font-size="12" fill="#E9D5FF" font-weight="600">Full-Stack Dev</text>

      <!-- Tag 2 -->
      <rect x="145" y="0" width="125" height="30" rx="15" fill="rgba(6, 182, 212, 0.15)" stroke="rgba(6, 182, 212, 0.4)" stroke-width="1" />
      <circle cx="160" cy="15" r="4" fill="#06B6D4" />
      <text x="175" y="20" font-family="'Space Grotesk', sans-serif" font-size="12" fill="#CFFAFE" font-weight="600">AI Agents</text>

      <!-- Tag 3 -->
      <rect x="285" y="0" width="135" height="30" rx="15" fill="rgba(236, 72, 153, 0.15)" stroke="rgba(236, 72, 153, 0.4)" stroke-width="1" />
      <circle cx="300" cy="15" r="4" fill="#EC4899" />
      <text x="315" y="20" font-family="'Space Grotesk', sans-serif" font-size="12" fill="#FCE7F3" font-weight="600">AI Automation</text>
    </g>
  </g>
</svg>
